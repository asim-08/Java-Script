<!DOCTYPE html>
<html>
<head>
  <title>Updating ft</title>
</head>
<body>
  <script>
    function convertLength(length, from, to) {
      if (from !== 'km' && from !== 'miles' && from !== 'feet') {
        return `Invalid unit: ${from}`
      } else if (to !== 'km' && to !== 'miles' && to !== 'feet') {
        return `Invalid unit: ${to}`
      }

    
      if (from === 'km' && to === 'miles') {
        return `${length/1.6} miles`
      } else if (from === 'km' && to === 'ft') {
        return (length * 3281)
      } else if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`
      } else if (from === 'miles' && to === 'ft') {
        return (length * 5,280)
      } else if (from ===  'ft' && to === 'miles') {
        return (length / 5,280)
      } else if (from === 'ft' && to === 'km') {
        return (length / 3280)
      } else if (from === to) {
        return `${length} ${to}`
      }
    }
    console.log(convertLength(50, 'miles', 'km'))
    console.log(convertLength(50, 'km', 'miles'))
    console.log(convertLength(50, 'km', 'km'))
    console.log(convertLength(50, 'miles', 'miles'))
    console.log(convertLength(40, 'lbs', 'km'))
  </script>
</body>
</html>
