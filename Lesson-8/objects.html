      const student = {
        name: 'Asim',
        age: 18,
        course: 'Javascript'
      };
      // Convert object into JSON string.
      const convert_json = JSON.stringify(student);
      console.log(convert_json)

      // Save JSON string in Local Storage.
      localStorage.setItem('student', convert_json)

      // Retrieve data from Local storage.
      const saveStudent = localStorage.getItem('student')
      console.log(saveStudent)

      // Convert JSON string back into object.
      const convert_object = JSON.parse(saveStudent);
      console.log(convert_object)

      // Access object property.
      console.log(convert_object.name)
